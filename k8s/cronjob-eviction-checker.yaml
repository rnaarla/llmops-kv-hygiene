apiVersion: batch/v1
kind: CronJob
metadata:
  name: kv-hygiene-eviction-checker
spec:
  schedule: "@daily"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: eviction-checker
              image: llmops-kv-hygiene:cpu
              imagePullPolicy: IfNotPresent
              env:
                - name: FORENSIC_HMAC_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: forensic-hmac-secret
                      key: FORENSIC_HMAC_SECRET
              volumeMounts:
                - name: forensics
                  mountPath: /app/forensics
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  python -c "from tools.cache_tracer import ForensicLogger as F; import sys; r=F.verify_chain('forensics/kv_cache.log'); sys.exit(0 if r.get('ok') else 1)"
                  python tools/eviction_checker.py forensics/coverage.json --out forensics/verdict.json
          volumes:
            - name: forensics
              persistentVolumeClaim:
                claimName: forensics-pvc
